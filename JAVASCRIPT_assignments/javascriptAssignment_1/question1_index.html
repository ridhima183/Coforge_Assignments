<!DOCTYPE html>
<html>
<head>
    <title>User Name Program</title>
</head>
<body>

<script>
    // Ask the user for their name
    let username = prompt("Please enter your name:");

    // Display on the webpage
    document.write("<h1>Hello " + username + "!</h1>");

    // Display in an alert box
    alert("Hello " + username + "!");
</script>

</body>
</html>

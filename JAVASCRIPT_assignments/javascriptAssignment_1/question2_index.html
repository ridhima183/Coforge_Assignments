<!DOCTYPE html>
<html>
<head>
    <title>Change Background Color</title>

    <script>
        function changeColor() {
            document.bgColor = "blue";
        }
    </script>

</head>
<body>

    <h2>Click the button to change the background color.</h2>

    <form>
        <input type="button" value="Change Background" onclick="changeColor()">
    </form>

</body>
</html>
